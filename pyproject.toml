[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ais-monitor-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "jinja2>=3.1.6,<4", "itsdangerous>=2.2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
ais-server = "ais.server.cli:main"

[tool.setuptools.packages.find]
include = ["ais*"]

[tool.setuptools.package-data]
"ais.server" = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
