[project]
name = "ais"
version = "0.1.0"
description = "AIS experiments for Linux command behavior monitoring"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bashlex>=0.18",
    "httpx>=0.28,<1",
    "numpy>=2.5.4",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
paper = [
    "python-docx>=1.2,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
